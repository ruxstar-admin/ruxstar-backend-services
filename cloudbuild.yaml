substitutions:
  _REGION: us-central1
  _AR_REPO: ruxstar-backend
  _SERVICE_NAME: ruxstar-backend-services
  _RUNTIME_SA: backend-service-account@ruxstar-platform.iam.gserviceaccount.com
  _RUXSTAR_ENV: dev
  _MONGODB_DB: ruxstar_dev
  _GCS_BUCKET: ruxstar-profile-pictures
  _GCS_MEDIA_BUCKET: ruxstar-post-media
  _CORS_ORIGINS: https://ruxstar.com,https://www.ruxstar.com
  # The production KYC keys stay in cashfree-client-id / cashfree-client-secret, unused until launch.
  _CASHFREE_ENV: sandbox
  _CASHFREE_ID_SECRET: cashfree-sandbox-client-id
  _CASHFREE_KEY_SECRET: cashfree-sandbox-client-secret
  # All outgoing traffic leaves through Cloud NAT ruxstar-nat on the static IP ruxstar-egress-ip (34.46.40.84).
  # Cashfree Secure ID and MongoDB Atlas allow-list that IP, so both break if this is removed or the IP changes.
  _VPC_NETWORK: default
  _VPC_SUBNET: default

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --service-account=${_RUNTIME_SA}
      - --network=${_VPC_NETWORK}
      - --subnet=${_VPC_SUBNET}
      - --vpc-egress=all-traffic
      - --set-env-vars=^@^NODE_ENV=production@RUXSTAR_ENV=${_RUXSTAR_ENV}@MONGODB_DB=${_MONGODB_DB}@GCS_BUCKET=${_GCS_BUCKET}@GCS_MEDIA_BUCKET=${_GCS_MEDIA_BUCKET}@LOG_LEVEL=info@CORS_ORIGINS=${_CORS_ORIGINS}@OTP_PROVIDER=msg91@CASHFREE_ENV=${_CASHFREE_ENV}
      - --set-secrets=MONGODB_URI=mongodb-uri:latest,JWT_SECRET=jwt-secret:latest,MSG91_AUTH_KEY=msg91-auth-key:latest,MSG91_TEMPLATE_ID=msg91-template-id:latest,MSG91_SENDER_ID=msg91-sender-id:latest,CASHFREE_CLIENT_ID=${_CASHFREE_ID_SECRET}:latest,CASHFREE_CLIENT_SECRET=${_CASHFREE_KEY_SECRET}:latest,PAYOUT_ENCRYPTION_KEY=payout-encryption-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
