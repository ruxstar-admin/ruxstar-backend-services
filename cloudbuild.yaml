substitutions:
  _REGION: us-central1
  _AR_REPO: ruxstar-backend
  _SERVICE_NAME: ruxstar-backend-services
  _RUNTIME_SA: backend-service-account@ruxstar-platform.iam.gserviceaccount.com
  _RUXSTAR_ENV: dev
  _MONGODB_DB: ruxstar_dev
  _GCS_BUCKET: ruxstar-profile-pictures
  _GCS_MEDIA_BUCKET: ruxstar-post-media
  _CORS_ORIGINS: https://ruxstar.com,https://www.ruxstar.com
  # The production KYC keys stay in cashfree-client-id / cashfree-client-secret, unused until launch.
  _CASHFREE_ENV: sandbox
  _CASHFREE_ID_SECRET: cashfree-sandbox-client-id
  _CASHFREE_KEY_SECRET: cashfree-sandbox-client-secret
  # Print orders: Cashfree Payment Gateway (its own keys, separate from KYC) and the private print files bucket.
  _CASHFREE_PG_ENV: sandbox
  _CASHFREE_PG_ID_SECRET: cashfree-pg-sandbox-client-id
  _CASHFREE_PG_KEY_SECRET: cashfree-pg-sandbox-client-secret
  _GCS_PRINT_BUCKET: ruxstar-print-files
  # Photos sent in chats, private.
  _GCS_CHAT_BUCKET: ruxstar-chat-media
  # Where Cashfree sends payment webhooks and returns customers. Switch to https://api.ruxstar.com once it serves HTTPS.
  _API_URL: https://ruxstar-backend-services-391710984982.us-central1.run.app
  # Cloud Scheduler job ruxstar-order-timers calls /jobs/orders every 10 minutes as this account, with _API_URL as the
  # token's audience. Change both together.
  _JOBS_INVOKER: ruxstar-scheduler@ruxstar-platform.iam.gserviceaccount.com
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --service-account=${_RUNTIME_SA}
      # Direct VPC egress through Cloud NAT (static IP 34.46.40.84) made every MongoDB Atlas round trip take 5-11 s,
      # so the API couldn't reach the database. Outgoing traffic uses Google's own addresses until the static IP moves
      # to a Serverless VPC Access connector. Cashfree calls that need the allow-listed IP fail until then.
      - --clear-network
      # Pairs are split on ";" because CORS_ORIGINS has commas and JOBS_INVOKER has an "@".
      - --set-env-vars=^;^NODE_ENV=production;RUXSTAR_ENV=${_RUXSTAR_ENV};MONGODB_DB=${_MONGODB_DB};GCS_BUCKET=${_GCS_BUCKET};GCS_MEDIA_BUCKET=${_GCS_MEDIA_BUCKET};LOG_LEVEL=info;CORS_ORIGINS=${_CORS_ORIGINS};OTP_PROVIDER=msg91;CASHFREE_ENV=${_CASHFREE_ENV};CASHFREE_PG_ENV=${_CASHFREE_PG_ENV};GCS_PRINT_BUCKET=${_GCS_PRINT_BUCKET};GCS_CHAT_BUCKET=${_GCS_CHAT_BUCKET};API_URL=${_API_URL};JOBS_INVOKER=${_JOBS_INVOKER}
      - --set-secrets=MONGODB_URI=mongodb-uri:latest,JWT_SECRET=jwt-secret:latest,MSG91_AUTH_KEY=msg91-auth-key:latest,MSG91_TEMPLATE_ID=msg91-template-id:latest,MSG91_SENDER_ID=msg91-sender-id:latest,CASHFREE_CLIENT_ID=${_CASHFREE_ID_SECRET}:latest,CASHFREE_CLIENT_SECRET=${_CASHFREE_KEY_SECRET}:latest,PAYOUT_ENCRYPTION_KEY=payout-encryption-key:latest,CASHFREE_PG_CLIENT_ID=${_CASHFREE_PG_ID_SECRET}:latest,CASHFREE_PG_SECRET=${_CASHFREE_PG_KEY_SECRET}:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
